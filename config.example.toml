[clock]
# strftime format, localized via LC_TIME
# %H=hour24, %M=min, %S=sec, %a=weekday, %A=Weekday, %b=month, %B=Month, %d=day, %Y=year
formats = ["%H:%M", "%a %d %b"]  # click to cycle

[battery]
enabled = true
hide_charging_above = 98
hide_discharging_above = 20
urgent_below = 10

[bluetooth]
enabled = true

[cpu]
enabled = true
show_above = 50
show_core_above = 95
average_seconds = 5
urgent_above = 95

[ram]
enabled = true
show_above = 70
urgent_above = 90

[[disk]]
path = "/"
show_below = 20
urgent_below = 5
unit = "gb"  # "gb" or "percent"

[wifi]
enabled = true
show_mode = "weak_signal"  # "weak_signal", "unknown", "always"
show_below = -70           # dBm, show when signal weaker than this
urgent_below = -80
home_networks = ["MyHomeWiFi"]  # used when show_mode = "unknown"

[network]
enabled = true  # shows warning when no default route

[vpn]
enabled = true
interfaces = ["tun*", "wg*", "tap*", "cscotun*"]

