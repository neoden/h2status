name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o h2status-linux-amd64

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o h2status-linux-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            h2status-linux-amd64
            h2status-linux-arm64
